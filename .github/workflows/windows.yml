name: Windows

on:
  push:
    branches: [dev, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-fatal-infos: в проекте есть предсуществующие info-замечания
      # (prefer_initializing_formals и т.п.), а без флага analyze падает и на них.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Раньше тестов: смысл этого workflow — увидеть ошибки компилятора
      # Windows-части, и красный тест не должен до них не дать дойти.
      - name: Build
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verge-windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14

      # Inno Setup предустановлен не на всех образах windows-latest — ставим
      # явно, чтобы сборка не зависела от состава образа.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh scripts/make_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: verge-windows-installer
          path: dist/*.exe
          retention-days: 14

      - name: Test
        run: flutter test

      # Только по тегу. Ассет обязан оканчиваться на .exe и быть в релизе
      # единственным .exe: именно так его ищет UpdateService
      # (lib/services/update_service.dart).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
